name: studyflow
description: An Intelligent Academic Task & Study Management System
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.11.3 <4.0.0'
  

dependencies:
  flutter:
    sdk: flutter

  # Firebase — SDK v4.11.0 (March 2026)
  firebase_core: ^4.4.0
  firebase_auth: ^6.3.0
  cloud_firestore: ^6.2.0

  # State Management
  provider: ^6.1.2

  # Charts & Visualization
  fl_chart: ^1.2.0

  # Local Notifications
  flutter_local_notifications: ^16.3.0
  timezone: ^0.9.0

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

